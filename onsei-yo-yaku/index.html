<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI議事録・要約アシスト</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 録音中のパルスアニメーション */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-red 2s infinite;
        }

        /* ローディングスピナー */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- ナビゲーションヘッダー -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight hidden sm:block">AI議事録アシスト</h1>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight sm:hidden">AI議事録</h1>
            </div>
            
            <!-- APIキー設定トグルボタン -->
            <button id="btn-toggle-settings" class="text-sm font-medium text-slate-600 hover:text-blue-600 flex items-center gap-1 transition-colors px-3 py-2 rounded-md hover:bg-slate-100">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="hidden sm:inline">API設定</span>
            </button>
        </div>
    </header>

    <!-- 設定パネル (初期状態は非表示) -->
    <div id="settings-panel" class="hidden bg-slate-800 text-white shadow-inner border-b border-slate-700 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
                <div class="flex-1 w-full">
                    <label for="api-key-input" class="block text-sm font-medium text-slate-300 mb-2">Gemini API Key (プレビュー環境では入力不要)</label>
                    <div class="flex gap-2">
                        <input type="password" id="api-key-input" placeholder="AIzaSy..." class="flex-1 bg-slate-900 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-slate-500">
                        <button id="btn-save-key" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition-colors whitespace-nowrap">
                            保存
                        </button>
                        <button id="btn-delete-key" class="bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition-colors whitespace-nowrap hidden">
                            削除
                        </button>
                    </div>
                    <p class="mt-2 text-xs text-slate-400">※APIキーはブラウザにのみ保存され、外部サーバーには送信されません。</p>
                </div>
                <div id="api-status-badge" class="px-4 py-2 rounded-full text-sm font-medium bg-slate-700 text-slate-300 flex items-center gap-2 border border-slate-600">
                    <span class="w-2 h-2 rounded-full bg-slate-500"></span> 未設定
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
        
        <!-- 左カラム: 録音と文字起こし -->
        <div class="lg:col-span-6 flex flex-col gap-6">
            
            <!-- ステップ1: 録音/ファイルアップロードパネル -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-blue-100 text-blue-600 text-sm">1</span>
                        音声の入力 (録音 または ファイル)
                    </h2>
                </div>
                
                <div class="p-6 flex-1 flex flex-col items-center justify-center min-h-[200px] relative">
                    <!-- 会議コンテキスト設定 (アコーディオン) -->
                    <details class="w-full mb-6 group bg-slate-50 rounded-lg border border-slate-200">
                        <summary class="cursor-pointer px-4 py-3 font-medium text-sm text-slate-700 flex justify-between items-center hover:bg-slate-100 transition-colors">
                            <span>📝 会議の前提情報 (精度UP) - 任意</span>
                            <svg class="w-4 h-4 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </summary>
                        <div class="px-4 pb-4 pt-1">
                            <textarea id="context-input" rows="2" class="block w-full p-2.5 text-sm text-slate-900 bg-white rounded-lg border border-slate-300 focus:ring-blue-500 focus:border-blue-500" placeholder="例: 参加者は田中、鈴木。次期プロダクトの仕様検討会議。「アルファ版」「クラウド移行」などのキーワードが出ます。"></textarea>
                        </div>
                    </details>

                    <!-- 録音・アップロードコントロール -->
                    <div class="text-center w-full">
                        <div id="recording-timer" class="text-4xl font-mono text-slate-700 mb-4 font-light tracking-wider">00:00</div>
                        
                        <!-- マイク録音ボタン群 -->
                        <div class="flex justify-center items-center gap-4 mb-4">
                            <!-- マイク許可＆録音開始 -->
                            <button id="btn-start-record" class="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg transition-transform transform hover:scale-105 active:scale-95" title="マイクで録音開始">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            </button>
                            
                            <!-- 録音一時停止/再開 (初期非表示) -->
                            <button id="btn-pause-record" class="hidden w-12 h-12 rounded-full bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center shadow transition-transform transform hover:scale-105 active:scale-95">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </button>

                            <!-- 録音停止 (初期非表示) -->
                            <button id="btn-stop-record" class="hidden w-16 h-16 rounded-full bg-slate-800 hover:bg-slate-900 text-white flex items-center justify-center shadow-lg transition-transform transform hover:scale-105 active:scale-95">
                                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
                            </button>
                        </div>
                        
                        <p id="record-status-text" class="text-sm text-slate-500 font-medium mb-4">マイクボタンで録音、または以下からファイルを選択</p>

                        <!-- 代替手段：ファイルアップロード (マイクが使えない環境用) -->
                        <div class="flex justify-center border-t border-slate-100 pt-4 transition-all duration-300" id="upload-section">
                            <label id="upload-label" class="cursor-pointer inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-300 border border-slate-300">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                <span>音声ファイルをアップロード</span>
                                <input type="file" id="audio-file-input" accept="audio/*" class="hidden">
                            </label>
                        </div>
                    </div>

                    <!-- 録音/ファイル読み込み完了後のアクション (初期非表示) -->
                    <div id="transcribe-actions" class="hidden mt-6 w-full pt-6 border-t border-slate-100 flex flex-col gap-3">
                        <audio id="audio-playback" controls class="w-full h-10"></audio>
                        <button id="btn-transcribe" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            AI文字起こしを実行
                        </button>
                    </div>
                </div>
            </section>

            <!-- ステップ2: 文字起こしエディタ -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-1 min-h-[300px]">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-blue-100 text-blue-600 text-sm">2</span>
                        文字起こし結果 (編集可)
                    </h2>
                </div>
                <div class="p-0 flex-1 relative group">
                    <textarea id="transcription-editor" class="w-full h-full min-h-[300px] p-6 border-0 focus:ring-0 resize-none text-slate-700 leading-relaxed" placeholder="ここに文字起こし結果が表示されます。手動で直接入力や修正を行うことも可能です。"></textarea>
                    
                    <!-- 処理中オーバーレイ -->
                    <div id="transcribe-loading" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center z-10">
                        <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                        <p class="text-blue-700 font-medium animate-pulse">音声を解析・文字起こし中...</p>
                        <p class="text-sm text-slate-500 mt-2">音声の長さにより数分かかる場合があります</p>
                    </div>
                </div>
            </section>
        </div>

        <!-- 右カラム: 要約と出力 -->
        <div class="lg:col-span-6 flex flex-col gap-6">
            <!-- ステップ3: 要約アクション＆結果 -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-1 h-full">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-blue-100 text-blue-600 text-sm">3</span>
                        議事録の要約・タスク抽出
                    </h2>
                    <button id="btn-summarize" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 px-4 rounded-lg shadow transition-colors flex items-center gap-2 w-full sm:w-auto justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        要約を生成
                    </button>
                </div>
                
                <div class="p-0 flex flex-col flex-1 relative h-full">
                    <textarea id="summary-editor" class="w-full flex-1 min-h-[400px] p-6 border-0 focus:ring-0 resize-none text-slate-700 leading-relaxed font-mono text-sm" placeholder="「要約を生成」ボタンを押すと、左側のテキストを元にAIがビジネス向けの議事録フォーマット（目的、決定事項、ToDo）で要約を作成します。"></textarea>
                    
                    <!-- 処理中オーバーレイ -->
                    <div id="summary-loading" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center z-10">
                        <div class="w-12 h-12 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mb-4"></div>
                        <p class="text-green-700 font-medium animate-pulse">構造化・要約中...</p>
                    </div>
                </div>

                <!-- エクスポートフッター -->
                <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex flex-wrap gap-3 justify-end rounded-b-2xl">
                    <button id="btn-copy" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-medium py-2 px-4 rounded-lg text-sm transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        要約をコピー
                    </button>
                    <button id="btn-download-md" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 px-4 rounded-lg text-sm shadow transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4-4m0 0l-4-4m4 4V4"></path></svg>
                        Markdownで保存
                    </button>
                </div>
            </section>
        </div>
    </main>

    <!-- トースト通知コンテナ -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        /**
         * アプリケーションの状態管理
         */
        const state = {
            apiKey: localStorage.getItem('gemini_api_key') || '',
            isRecording: false,
            isPaused: false,
            mediaRecorder: null,
            audioChunks: [],
            audioBlob: null,
            startTime: null,
            timerInterval: null,
            elapsedTime: 0
        };

        /**
         * DOM要素の参照
         */
        const elements = {
            btnToggleSettings: document.getElementById('btn-toggle-settings'),
            settingsPanel: document.getElementById('settings-panel'),
            apiKeyInput: document.getElementById('api-key-input'),
            btnSaveKey: document.getElementById('btn-save-key'),
            btnDeleteKey: document.getElementById('btn-delete-key'),
            apiStatusBadge: document.getElementById('api-status-badge'),
            contextInput: document.getElementById('context-input'),
            
            btnStartRecord: document.getElementById('btn-start-record'),
            btnPauseRecord: document.getElementById('btn-pause-record'),
            btnStopRecord: document.getElementById('btn-stop-record'),
            recordingTimer: document.getElementById('recording-timer'),
            recordStatusText: document.getElementById('record-status-text'),
            audioFileInput: document.getElementById('audio-file-input'),
            uploadSection: document.getElementById('upload-section'),
            uploadLabel: document.getElementById('upload-label'),
            transcribeActions: document.getElementById('transcribe-actions'),
            audioPlayback: document.getElementById('audio-playback'),
            
            btnTranscribe: document.getElementById('btn-transcribe'),
            transcriptionEditor: document.getElementById('transcription-editor'),
            transcribeLoading: document.getElementById('transcribe-loading'),
            
            btnSummarize: document.getElementById('btn-summarize'),
            summaryEditor: document.getElementById('summary-editor'),
            summaryLoading: document.getElementById('summary-loading'),
            btnCopy: document.getElementById('btn-copy'),
            btnDownloadMd: document.getElementById('btn-download-md'),
            
            toastContainer: document.getElementById('toast-container')
        };

        /**
         * ユーティリティ: トースト通知
         */
        function showToast(message, type = 'info', duration = 4000) {
            const toast = document.createElement('div');
            const bgColors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                info: 'bg-slate-800'
            };
            
            toast.className = `${bgColors[type]} text-white px-6 py-3 rounded-xl shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 pointer-events-auto max-w-md`;
            
            let icon = '';
            if (type === 'success') icon = '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            else if (type === 'error') icon = '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            
            toast.innerHTML = `${icon} <span class="text-sm font-medium leading-relaxed">${message}</span>`;
            
            elements.toastContainer.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        /**
         * ユーティリティ: エラー時にアップロード領域を強調表示
         */
        function highlightUploadSection() {
            elements.uploadLabel.classList.add('ring-4', 'ring-blue-300', 'bg-blue-50', 'text-blue-700', 'border-blue-400', 'scale-105');
            elements.uploadLabel.classList.remove('bg-slate-100', 'text-slate-700');
            
            // マイクボタンを無効化してユーザーの迷いをなくす
            elements.btnStartRecord.disabled = true;
            elements.btnStartRecord.classList.add('opacity-50', 'cursor-not-allowed');
            
            elements.recordStatusText.textContent = 'マイクが使えない環境です。音声ファイルを選択してください。';
            elements.recordStatusText.classList.add('text-blue-600', 'font-bold');

            setTimeout(() => {
                elements.uploadLabel.classList.remove('ring-4', 'ring-blue-300', 'scale-105');
            }, 2000);
        }

        /**
         * APIキー管理ロジック
         */
        function updateApiUI() {
            if (state.apiKey) {
                elements.apiKeyInput.value = state.apiKey;
                elements.btnDeleteKey.classList.remove('hidden');
                elements.apiStatusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500"></span> 準備完了`;
                elements.apiStatusBadge.classList.replace('bg-slate-700', 'bg-green-900/30');
                elements.apiStatusBadge.classList.replace('text-slate-300', 'text-green-400');
                elements.apiStatusBadge.classList.replace('border-slate-600', 'border-green-800');
            } else {
                elements.apiKeyInput.value = '';
                elements.btnDeleteKey.classList.add('hidden');
                elements.apiStatusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> 未設定`;
                elements.apiStatusBadge.classList.replace('bg-green-900/30', 'bg-slate-700');
                elements.apiStatusBadge.classList.replace('text-green-400', 'text-slate-300');
                elements.apiStatusBadge.classList.replace('border-green-800', 'border-slate-600');
            }
        }

        elements.btnToggleSettings.addEventListener('click', () => {
            elements.settingsPanel.classList.toggle('hidden');
        });

        elements.btnSaveKey.addEventListener('click', () => {
            const key = elements.apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                state.apiKey = key;
                updateApiUI();
                showToast('APIキーを保存しました', 'success');
                elements.settingsPanel.classList.add('hidden');
            } else {
                showToast('APIキーを入力してください', 'error');
            }
        });

        elements.btnDeleteKey.addEventListener('click', () => {
            localStorage.removeItem('gemini_api_key');
            state.apiKey = '';
            updateApiUI();
            showToast('APIキーを削除しました', 'info');
        });

        updateApiUI();

        /**
         * 録音・ファイル読み込みロジック
         */
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimer() {
            if (state.isRecording && !state.isPaused) {
                state.elapsedTime = (Date.now() - state.startTime) / 1000;
                elements.recordingTimer.textContent = formatTime(state.elapsedTime);
            }
        }

        async function startRecording() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('NotSupportedError');
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                let mimeType = 'audio/webm';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/mp4';
                }

                state.mediaRecorder = new MediaRecorder(stream, { mimeType });
                state.audioChunks = [];
                
                state.mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        state.audioChunks.push(event.data);
                    }
                };
                
                state.mediaRecorder.onstop = () => {
                    const blob = new Blob(state.audioChunks, { type: state.mediaRecorder.mimeType });
                    state.audioBlob = blob;
                    
                    const audioURL = URL.createObjectURL(blob);
                    elements.audioPlayback.src = audioURL;
                    
                    elements.transcribeActions.classList.remove('hidden');
                    elements.recordStatusText.textContent = '録音完了。再生して確認、または文字起こしを実行してください。';
                    elements.recordStatusText.classList.replace('text-red-500', 'text-slate-500');
                    elements.uploadSection.classList.remove('hidden');
                    
                    stream.getTracks().forEach(track => track.stop());
                };
                
                state.mediaRecorder.start(1000);
                
                state.isRecording = true;
                state.isPaused = false;
                state.startTime = Date.now() - (state.elapsedTime * 1000 || 0);
                state.timerInterval = setInterval(updateTimer, 1000);
                
                elements.btnStartRecord.classList.add('hidden');
                elements.btnPauseRecord.classList.remove('hidden');
                elements.btnStopRecord.classList.remove('hidden');
                elements.btnStartRecord.classList.add('recording-pulse');
                elements.btnStopRecord.classList.add('recording-pulse');
                
                elements.recordStatusText.textContent = '録音中...';
                elements.recordStatusText.classList.add('text-red-500');
                elements.transcribeActions.classList.add('hidden');
                elements.uploadSection.classList.add('hidden');
                
            } catch (err) {
                console.error("Microphone Error:", err);
                
                if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
                    showToast('【Googleサイト等の制限】<br>このページ内ではセキュリティ上マイクが使えません。下の「音声ファイルをアップロード」をご利用ください。', 'error', 6000);
                    highlightUploadSection();
                } else if (err.name === 'NotSupportedError') {
                    showToast('この環境（HTTP接続やブラウザの仕様）ではマイクが使えません。下の「音声ファイルをアップロード」をご利用ください。', 'error', 6000);
                    highlightUploadSection();
                } else {
                    showToast('マイクへのアクセスに失敗しました。ファイルアップロード機能をご利用ください。', 'error', 5000);
                    highlightUploadSection();
                }
            }
        }

        function pauseRecording() {
            if (state.mediaRecorder && state.isRecording) {
                if (state.mediaRecorder.state === 'recording') {
                    state.mediaRecorder.pause();
                    state.isPaused = true;
                    
                    elements.btnPauseRecord.innerHTML = '<svg class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>';
                    elements.btnStopRecord.classList.remove('recording-pulse');
                    elements.recordStatusText.textContent = '一時停止中';
                } else if (state.mediaRecorder.state === 'paused') {
                    state.mediaRecorder.resume();
                    state.isPaused = false;
                    
                    state.startTime = Date.now() - (state.elapsedTime * 1000);
                    
                    elements.btnPauseRecord.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
                    elements.btnStopRecord.classList.add('recording-pulse');
                    elements.recordStatusText.textContent = '録音中...';
                }
            }
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                clearInterval(state.timerInterval);
                
                state.isRecording = false;
                state.isPaused = false;
                state.elapsedTime = 0;
                
                elements.btnStartRecord.classList.remove('hidden', 'recording-pulse');
                elements.btnPauseRecord.classList.add('hidden');
                elements.btnStopRecord.classList.add('hidden', 'recording-pulse');
                elements.btnPauseRecord.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            }
        }

        elements.audioFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            state.audioBlob = file;
            
            const audioURL = URL.createObjectURL(file);
            elements.audioPlayback.src = audioURL;
            
            elements.transcribeActions.classList.remove('hidden');
            elements.recordStatusText.textContent = `ファイル「${file.name}」を読み込みました。`;
            elements.recordStatusText.classList.remove('text-red-500');
            elements.recordStatusText.classList.add('text-blue-600');
            
            showToast('音声ファイルを読み込みました', 'success');
        });

        elements.btnStartRecord.addEventListener('click', () => {
            elements.recordingTimer.textContent = '00:00';
            startRecording();
        });
        elements.btnPauseRecord.addEventListener('click', pauseRecording);
        elements.btnStopRecord.addEventListener('click', stopRecording);

        /**
         * Gemini API 呼び出し基盤
         */
        async function callGeminiAPI(payload) {
            const apiKey = state.apiKey || "";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    console.warn(`API呼び出し失敗、${delays[i]/1000}秒後にリトライします...`, error);
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        elements.btnTranscribe.addEventListener('click', async () => {
            if (!state.audioBlob) {
                showToast('音声データがありません', 'error');
                return;
            }

            elements.transcribeLoading.classList.remove('hidden');
            elements.btnTranscribe.disabled = true;

            try {
                const base64Data = await blobToBase64(state.audioBlob);
                const mimeType = state.audioBlob.type || 'audio/mp3';
                const contextStr = elements.contextInput.value.trim();
                
                let prompt = `
あなたはプロの議事録作成アシスタントです。
提供された音声データの文字起こしを行ってください。

【指示】
1. 音声の内容を正確にテキスト化してください。
2. 複数の発言者がいる場合、声質を聞き分けて「Aさん: 」「Bさん: 」のように話者を分離して記載してください。
3. 「えー」「あの」「その」などの意味を持たないフィラー（ケバ）は削除し、ビジネス文書として読みやすく整形してください（ケバ取り）。
4. 句読点を適切に補い、段落を適宜分けてください。
`;
                if (contextStr) {
                    prompt += `\n\n【会議の前提情報・キーワード】\n以下の情報を参考に、専門用語や人名を正確に認識してください。\n${contextStr}`;
                }

                const payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ]
                    }],
                    systemInstruction: {
                        parts: [{ text: "あなたはプロフェッショナルなAIアシスタントです。指示に忠実に、高品質な出力を行ってください。" }]
                    }
                };

                const transcribedText = await callGeminiAPI(payload);
                elements.transcriptionEditor.value = transcribedText;
                showToast('文字起こしが完了しました', 'success');
                elements.summaryEditor.placeholder = "左側のテキストを確認・修正後、「要約を生成」ボタンを押してください。";

            } catch (error) {
                console.error("Transcription Error:", error);
                showToast(`文字起こしエラー: ${error.message}`, 'error');
            } finally {
                elements.transcribeLoading.classList.add('hidden');
                elements.btnTranscribe.disabled = false;
            }
        });

        elements.btnSummarize.addEventListener('click', async () => {
            const transcriptionText = elements.transcriptionEditor.value.trim();
            
            if (!transcriptionText) {
                showToast('要約するテキストがありません。録音するかテキストを入力してください。', 'error');
                return;
            }

            elements.summaryLoading.classList.remove('hidden');
            elements.btnSummarize.disabled = true;

            try {
                const prompt = `
あなたは優秀なプロジェクトマネージャーです。
以下の会議の文字起こし（ドラフト）から、ビジネス向けの要約を作成してください。

【出力フォーマット（Markdown形式）】
## 🎯 会議の目的
（会議が開催された主旨を簡潔に）

## 📌 決定事項
（合意された内容や決定事項を箇条書きで）
- 

## 🏃 ネクストアクション（ToDo）
（誰が、いつまでに、何をするかを箇条書きで明確に）
- [担当者] [期限] [タスク内容]

## 📝 重要なポイント・備考
（上記に当てはまらないが、重要な意見や懸念事項があれば）

【議事録ドラフト】
${transcriptionText}
`;

                const payload = {
                    contents: [{
                        parts: [{ text: prompt }]
                    }],
                    systemInstruction: {
                        parts: [{ text: "あなたはプロフェッショナルなAIアシスタントです。" }]
                    }
                };

                const summaryText = await callGeminiAPI(payload);
                elements.summaryEditor.value = summaryText;
                showToast('要約が完了しました', 'success');

            } catch (error) {
                console.error("Summary Error:", error);
                showToast(`要約エラー: ${error.message}`, 'error');
            } finally {
                elements.summaryLoading.classList.add('hidden');
                elements.btnSummarize.disabled = false;
            }
        });

        elements.btnCopy.addEventListener('click', () => {
            const text = elements.summaryEditor.value;
            if (!text) {
                showToast('コピーする内容がありません', 'error');
                return;
            }
            
            try {
                document.execCommand('copy');
                elements.summaryEditor.select();
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                showToast('クリップボードにコピーしました', 'success');
            } catch (err) {
                showToast('コピーに失敗しました', 'error');
            }
        });

        // 修正箇所：Markdownダウンロード処理
        elements.btnDownloadMd.addEventListener('click', () => {
            const summary = elements.summaryEditor.value.trim();
            const transcription = elements.transcriptionEditor.value.trim();
            
            if (!summary && !transcription) {
                showToast('ダウンロードする内容がありません', 'error');
                return;
            }

            const dateStr = new Date().toLocaleDateString('ja-JP').replace(/\//g, '-');
            let content = `# 議事録要約 (${dateStr})\n\n`;
            
            if (summary) {
                content += `${summary}\n\n---\n\n`;
            }
            if (transcription) {
                content += `## 🎙️ 文字起こし全文\n\n${transcription}\n`;
            }

            // 【重要】文字化け防止のため、UTF-8のBOM（Byte Order Mark）を付与します
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            
            // BOMとテキストコンテンツを結合してBlobを作成
            const blob = new Blob([bom, content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Meeting_Minutes_${dateStr}.md`;
            a.style.display = 'none';
            
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('Markdownファイルを保存しました', 'success');
        });

    </script>
</body>
